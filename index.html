<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mera Restaurant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff8f0;
    }
    header {
      background: #d9480f;
      color: RED;
      text-align: center;
      padding: 20px;
    }
    .menu {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .item {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .item h3 { margin: 0 0 5px 0; }
    .item p { margin: 0; color: #666; }
    .price { font-weight: bold; color: #d9480f; font-size: 18px; }
  </style>
</head>
<body>

  <header>
    <h1>Mera Restaurant</h1>
    <p>Swaadisht khana, ghar tak</p>
  </header>

  <div class="menu">
    <div class="item">
      <div>
        <h3>Paneer Butter Masala</h3>
        <p>Creamy aur masaledar</p>
      </div>
      <div class="price">₹220</div>
    </div>

    <div class="item">
      <div>
        <h3>Dal Tadka</h3>
        <p>Ghar jaisa swaad</p>
      </div>
      <div class="price">₹200
      
    </div>
    </div>

    <div class="item">
      <div>
        <h3>Butter Naan</h3>
        <p>Garam aur naram</p>
      </div>
      <div class="price">₹40</div>
    </div>
  </div>

</body>
</html>
