<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mera Restaurant</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fff8f0; }
    header { background: #d9480f; color: white; text-align: center; padding: 20px; }
    .box { max-width: 600px; margin: 20px auto; padding: 0 15px; }
    .item { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .item h3 { margin: 0 0 5px 0; }
    .item p { margin: 0; color: #666; }
    .price { font-weight: bold; color: #d9480f; font-size: 18px; }
    form { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; margin-top: 15px; padding: 12px; background: #d9480f; color: white;
             border: none; border-radius: 6px; font-size: 18px; }
    #total { margin-top: 12px; font-weight: bold; }
    #msg { margin-top: 12px; font-weight: bold; color: green; }
  </style>
</head>
<body>

  <header>
    <h1>Mera Restaurant</h1>
    <p>Swaadisht khana, ghar tak</p>
  </header>

  <div class="box">
    <h2>Menu</h2>
    <div class="item"><div><h3>Paneer Butter Masala</h3><p>Creamy aur masaledar</p></div><div class="price">₹220</div></div>
    <div class="item"><div><h3>Dal Tadka</h3><p>Ghar jaisa swaad</p></div><div class="price">₹150</div></div>
    <div class="item"><div><h3>Butter Naan</h3><p>Garam aur naram</p></div><div class="price">₹40</div></div>

    <h2>Order karein</h2>
    <form id="orderForm">
      <label>Aapka naam</label>
      <input type="text" id="name" required>

      <label>Phone number</label>
      <input type="tel" id="phone" required>

      <label>Dish</label>
      <select id="dish">
        <option value="Paneer Butter Masala" data-price="220">Paneer Butter Masala - ₹220</option>
        <option value="Dal Tadka" data-price="150">Dal Tadka - ₹150</option>
        <option value="Butter Naan" data-price="40">Butter Naan - ₹40</option>
      </select>

      <label>Kitni quantity</label>
      <input type="number" id="qty" value="1" min="1" max="20">

      <label>Delivery address</label>
      <textarea id="address" rows="3" required></textarea>

      <div id="total"></div>
      <button type="submit">Order bhejein</button>
      <div id="msg"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDq_gygDldcA1CWodI6UXQ6KckLhygcDH8",
      authDomain: "restaurant-ccb55.firebaseapp.com",
      projectId: "restaurant-ccb55",
      storageBucket: "restaurant-ccb55.firebasestorage.app",
      messagingSenderId: "399415890887",
      appId: "1:399415890887:web:1f098dd4d53b55a0727fe2",
      measurementId: "G-NTYT8JZLV3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DELIVERY_CHARGE = 30;

    function hisaab() {
      const dish = document.getElementById("dish");
      const price = Number(dish.options[dish.selectedIndex].dataset.price);
      const qty = Number(document.getElementById("qty").value) || 1;
      const total = price * qty + DELIVERY_CHARGE;
      document.getElementById("total").textContent =
        "Total: ₹" + total + " (₹" + DELIVERY_CHARGE + " delivery charge ke saath)";
      return total;
    }
    document.getElementById("dish").addEventListener("change", hisaab);
    document.getElementById("qty").addEventListener("input", hisaab);
    hisaab();

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.style.color = "green";
      msg.textContent = "Order bheja ja raha hai...";
      try {
        await addDoc(collection(db, "orders"), {
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          dish: document.getElementById("dish").value,
          qty: Number(document.getElementById("qty").value),
          address: document.getElementById("address").value,
          total: hisaab(),
          status: "naya",
          createdAt: serverTimestamp()
        });
        msg.textContent = "Dhanyavaad! Aapka order mil gaya.";
        e.target.reset();
        hisaab();
      } catch (err) {
        msg.style.color = "red";
        msg.textContent = "Kuch gadbad hui, dobara try karein.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
